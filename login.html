<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="./src/css/auth.css">
</head>

<body>

<div class="auth-container">
<h2>Login</h2>

<input type="text" id="email" placeholder="Email or Username">
<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

<div class="divider">OR</div>

<button class="google" id="googleLogin">Login with Google</button>
<button class="github" id="githubLogin">Login with GitHub</button>

<p>No account? <a href="signup.html">Sign up</a></p>

</div>

<script type="module" src="./src/js/auth.js"></script>

</body>
</html>
