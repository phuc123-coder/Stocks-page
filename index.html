<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stocks+ | Homepage</title>
  <link rel="stylesheet" href="./src/css/index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="menu-header">

    <a href="index.html"><span class="white">Stocks</span><span class="green">+</span></a>
    <div class="search-box  ">
      <input id="symbol" type="text" placeholder="Search for news, tickers or companies">
      <button id="searchBtn" class="search-button"><i class="search-icon">🔍</i></button>
    </div>

    <a href="main.html" class="login_button">Mua chứng khoán</a>

    <a href="admin.html" class="login_button">Admin</a>

    <a href="login.html" class="login_button">Log in</a>

  </div>

  <div id="homepage">

    <div id="api-error" style="display:none; grid-column: 1 / -1; margin: 10px 0; color: #ef4444; font-weight: 600;"></div>

    <div id="news-section" class="news-wrapper">
      <section class="featured" id="featured"></section>

      <section class="news-grid" id="newsGrid"></section>
    </div>

    <div id="searchResultPanel" class="search-panel" style="display:none;">
      <div id="info" class="search-info"></div>
      <canvas id="stockChart" style="margin-top:25px; max-width:800px;"></canvas>
    </div>

    <section class="stock-sidebar">
      <h3>Top Gainers</h3>
      <ul id="gainers"></ul>

      <h3>Top Losers</h3>
      <ul id="losers"></ul>

      <h3>Most Active</h3>
      <ul id="active"></ul>
    </section>

  </div>

  <script src="./src/js/script.home.js"></script>
</body>
</html>
